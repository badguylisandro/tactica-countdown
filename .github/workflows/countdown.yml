name: TACTICA countdown
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: countdown
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - run: python countdown.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Save message id
        run: |
          git config user.name "countdown-bot"
          git config user.email "countdown-bot@users.noreply.github.com"
          git add message_id.txt
          git diff --cached --quiet || (git commit -m "Save countdown message id" && git push)
